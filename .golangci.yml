# Static analysis, golangci-lint v2 format. `make lint` is part of
# `make check`, the gate of the push hook: it must report 0 issues.
version: "2"

run:
  timeout: 5m
  tests: true

issues:
  # report every finding: the default caps hide repeats of the same message
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - contextcheck
    - unused
    - gocritic
    - forcetypeassert
    - nilerr
    - ineffassign
  settings:
    govet:
      enable-all: false
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
  exclusions:
    warn-unused: true
    presets:
      # Close, Flush and the writes to a response ignore their error on purpose.
      - std-error-handling
    rules:
      # Tests may use weak randomness, fixed file modes and so on.
      - path: _test\.go
        linters:
          - gosec

      # bodyclose cannot see that the test helpers (fixtures.Fetch, aGetBody)
      # read and close the body before they return the *http.Response.
      - path: _test\.go
        linters:
          - bodyclose

      # A failed type assertion in a test or a fixture panics and fails the
      # test. A checked assertion adds noise and no safety there.
      - path: '(_test\.go|^internal/fixtures/)'
        linters:
          - errcheck
          - forcetypeassert
        source: '\.\('

      # False positive: "X-CSRF-Token" is a header name, not a credential.
      - path: '^constants\.go$'
        linters:
          - gosec
        text: 'G101'
        source: 'HeaderXCSRFToken '

      # SendFile serves the path that the caller gives. It refuses ".." and the
      # doc comment tells the caller to validate request data.
      - path: '^response-writer\.go$'
        linters:
          - gosec
        text: 'G304'
        source: 'os\.Open\(name\)'

formatters:
  enable:
    - gofmt
