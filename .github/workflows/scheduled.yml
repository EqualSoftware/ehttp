name: scheduled

on:
  schedule:
    - cron: '17 2 * * *' # fuzz, every night
    - cron: '43 3 * * 1' # govulncheck, every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # The nightly cron and a manual run. Keep the list equal to FUZZ_TARGETS in the Makefile.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzRouterMatch, FuzzParseRange, FuzzAccepts, FuzzVary, FuzzCorsOrigin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: make fuzz FUZZ_TARGETS="$TARGET" FUZZTIME=5m
      - name: upload failing corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
      - name: open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Fuzz failure: ${{ matrix.target }}'
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$open" != "0" ]; then
            echo "An open issue exists for $TITLE."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The nightly fuzz run failed. Run: $RUN_URL

          The failing corpus entry is in the artifact fuzz-corpus-$TARGET of that run."

  govulncheck:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make vuln
      - name: open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'govulncheck failure'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$open" != "0" ]; then
            echo "An open issue exists for $TITLE."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The weekly govulncheck run failed. Run: $RUN_URL"
