# An experiment environment for the example: the app behind nginx (a trusted
# proxy), with Prometheus, Grafana and an on-demand k6 load test.
# See README.md in this folder.
name: ehttp-example

services:
  example:
    build:
      context: ../..
      dockerfile: examples/server/Dockerfile
    ports:
      - "127.0.0.1:3000:3000" # direct access: not a trusted peer
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 256m
    networks:
      stack:
        ipv4_address: 172.28.0.20

  nginx:
    image: nginx:1.30.6-alpine
    user: nginx
    depends_on: [example]
    ports:
      - "127.0.0.1:8080:8080" # through the trusted proxy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 64m
    networks:
      stack:
        ipv4_address: 172.28.0.10 # the only address the example trusts

  # No Alpine variant exists: this is the official minimal (busybox) image.
  prometheus:
    image: prom/prometheus:v3.15.1
    depends_on: [example]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [stack]

  # Per-container CPU and memory. No Alpine variant exists: this is the
  # official image from gcr.io. It needs root and read access to the host paths.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [stack]

  # The official image is Alpine-based; the project publishes no -alpine tag.
  grafana:
    image: grafana/grafana:13.2.5
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Demo credentials. They are for the demo only.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [stack]

  # Run on demand: docker compose --profile load run --rm k6
  # The k6 image is Alpine-based; the project publishes no -alpine tag.
  k6:
    image: grafana/k6:1.8.2
    profiles: [load]
    depends_on: [nginx]
    environment:
      BASE_URL: http://nginx:8080
      K6_VUS: "${K6_VUS:-5}"
      K6_DURATION: "${K6_DURATION:-20s}"
    volumes:
      - ./docker/k6/script.js:/script.js:ro
    command: ["run", "/script.js"]
    networks: [stack]

networks:
  stack:
    ipam:
      config:
        - subnet: 172.28.0.0/24
