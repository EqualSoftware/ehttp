# nginx as a trusted reverse proxy for the example. It runs as the user
# nginx (compose `user:`), so the pid file, the temp paths and the port 8080
# are all writable or unprivileged.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location / {
            proxy_pass http://example:3000;
            proxy_http_version 1.1;

            # Set, never append: a value from the client is dropped.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
        }
    }
}
